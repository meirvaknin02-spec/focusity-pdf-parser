name: tests

# Every push and pull request runs the real-form tests. Render deploys main on
# its own, so a red run here is the warning that the live parser is about to
# (or already did) change behaviour for a file students actually upload.
on:
  push:
  pull_request:

jobs:
  pytest:
    # Pinned, not ubuntu-latest: the Python below must match render.yaml's
    # PYTHON_VERSION (3.11.9), and ubuntu-latest moved to 26.04, which has no
    # 3.11.9 build, so setup-python failed before any test ran (Oct-Nov 2026).
    # Move both together when Render's Python is bumped.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
